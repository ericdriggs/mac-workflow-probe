name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Standard-size arm64 macOS labels from the actions/runner-images README.
        # The xlarge labels (macos-15-xlarge, macos-26-xlarge) are paid larger
        # runners and are left out. macos-latest currently aliases macos-26.
        label:
          - macos-26
          - macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run probe
        env:
          PROBE_LABEL: ${{ matrix.label }}
        run: bash ./probe.sh "$RUNNER_TEMP/probe-out"

      - name: Write summary
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/probe-out
          PROBE_LABEL: ${{ matrix.label }}
        run: |
          results="$OUT_DIR/results.json"
          {
            echo "### Probe on \`$PROBE_LABEL\`"
            echo
            if [ ! -f "$results" ]; then
              echo "No results.json was written."
            else
              echo "User: \`$(plutil -extract user raw -o - "$results")\`"
              echo
              echo "| # | Check | Result | Exit | ms |"
              echo "|---|---|---|---|---|"
              n="$(plutil -extract checks raw -o - "$results")"
              i=0
              while [ "$i" -lt "$n" ]; do
                num="$(plutil -extract "checks.$i.num" raw -o - "$results")"
                name="$(plutil -extract "checks.$i.name" raw -o - "$results")"
                res="$(plutil -extract "checks.$i.result" raw -o - "$results")"
                rc="$(plutil -extract "checks.$i.exit_code" raw -o - "$results" 2>/dev/null || echo "-")"
                ms="$(plutil -extract "checks.$i.duration_ms" raw -o - "$results")"
                echo "| $num | $name | $res | $rc | $ms |"
                i=$((i + 1))
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.label }}
          path: ${{ runner.temp }}/probe-out
          if-no-files-found: warn
